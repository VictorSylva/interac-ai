services:
  # 1. Backend Web Service (FastAPI) - Staging
  - type: web
    name: interact-backend-staging
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interact-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: interact-redis-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ENVIRONMENT
        value: staging
      - key: ENV
        value: staging
      - key: FRONTEND_URL
        value: "https://interacai.com"
      - key: ALLOWED_ORIGINS
        value: "https://interacai.com,https://www.interacai.com,https://interac-ai.web.app,https://interacai-staging.firebaseapp.com"

      # AI Provider (OpenRouter)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "deepseek/deepseek-chat"

      # Email (Resend HTTP API)
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "notifications@interacai.com"

      # Push Notifications (WebPush / VAPID)
      - key: VAPID_PUBLIC_KEY
        value: "BGraXz6LblLPtNakVurezDGyqcnng4PmZ2-552A-hDu__A5Q-6r7Y89E792p52lLU86PccAFM0uh14FBIEvlefY"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: "mailto:interacai.int@gmail.com"

      # WhatsApp
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false

  # 2. Redis Service (Free Tier Experiment) - Staging
  - type: redis
    name: interact-redis-staging
    plan: free
    ipAllowList: [] # Internal only

databases:
  # 3. PostgreSQL Database - Staging
  - name: interact-db-staging
    plan: free # 90 days, then upgrade
    ipAllowList: [] # Allow all internal
