events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        # Industry Modules & Generic Platform Primitives on Backend
        location ~ ^/api/v1/(entities|entity-types|observations|modules) {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ARGUS OS (Intelligence API)
        location /api/v1/ {
            proxy_pass http://argus_os:8001/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ARGUS Core Intelligence Service (Unified Enterprise Graph & Observations)
        location /api/v2/ {
            proxy_pass http://argus_core:8003/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;
        }

        # Core Business Automation Backend
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Websockets for Backend
        location /ws/ {
            proxy_pass http://backend:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
        
        location /static/ {
            proxy_pass http://argus_os:8001/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ARGUS Perception (Camera stream and triggers)
        location /cameras/ {
            proxy_pass http://argus_perception:8002/cameras/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # CRITICAL: Disable buffering for infinite MJPEG streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }
    }
}
