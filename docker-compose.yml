version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interact_backend
    command: sh -c "until python -c 'import socket; s=socket.socket(); s.connect((\"postgres\", 5432))'; do echo waiting for db; sleep 2; done; echo db port open, waiting extra 5s for startup...; sleep 5; uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - argus_storage:/var/lib/surveillance
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/interact_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interact_worker
    command: celery -A celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/interact_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - redis
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: interact_postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=interact_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: interact_redis
    ports:
      - "6381:6379"

  argus_os:
    build:
      context: ./argus-os
    container_name: interact_argus_os
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./argus-os:/app
      - argus_storage:/var/lib/surveillance
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      - redis

  argus_perception:
    build:
      context: ./argus-os/perception
    container_name: interact_argus_perception
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ./argus-os/perception:/app
      - argus_storage:/var/lib/surveillance
    ports:
      - "8002:8002"
    env_file:
      - ./argus-os/perception/.env
    environment:
      - CLOUD_GPU_ENDPOINT_URL=grpc://inference_service:50051
      - INFERENCE_PROVIDER=CLOUD_GPU
    depends_on:
      - argus_os
      - redis
      - inference_service

  inference_service:
    build:
      context: ./inference-service
    container_name: interact_inference_service
    ports:
      - "50051:50051"
    environment:
      - PORT=50051
      - INFERENCE_PROVIDER=CPU
    volumes:
      - ./inference-service:/app
    restart: always

  argus_core:
    build:
      context: ./argus-core
    container_name: interact_argus_core
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - ./argus-core:/app
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=interact_db
      - POSTGRES_PORT=5432
      - OPENROUTER_API_KEY=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
      - OPENROUTER_MODEL=deepseek/deepseek-chat
    depends_on:
      - redis
      - postgres

  api_gateway:
    image: nginx:alpine
    container_name: interact_api_gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - argus_os
      - argus_perception
      - inference_service
      - argus_core

volumes:
  postgres_data:
    external: true
    name: interact_postgres_data
  argus_storage:
    name: interact_argus_storage
